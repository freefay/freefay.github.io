<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皮克敏蘑菇計時器</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 15px; color: #333; }
    h1 { text-align: center; color: #5d4037; margin-bottom: 15px; }
    
    .add-location-form { max-width: 900px; margin: 0 auto 20px auto; padding: 10px; background-color: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; }
    .add-location-form input, .add-location-form select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .add-location-form button { padding: 8px 15px; background-color: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; }

    .tables-container { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; align-items: flex-start; }
    .table-wrapper { flex: 1; min-width: 350px; }
    
    table { width: 100%; border-collapse: collapse; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #edf2f7; font-size: 14px; }
    th { background-color: #795548; color: white; }
    .category-title { background-color: #e2e8f0; font-weight: bold; color: #334155; padding: 8px; }

    .time-input-container { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
    .time-input-container input { width: 40px; padding: 4px 2px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; }
    
    .countdown-display { font-weight: bold; color: #e67e22; }
    .spawned { color: #27ae60; }
    
    .clear-btn, .delete-loc-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; color: white; }
    .clear-btn { background-color: #94a3b8; }
    .delete-loc-btn { background-color: #e53e3e; }

    @media (max-width: 768px) { .tables-container { flex-direction: column; } }
  </style>
</head>
<body>

  <h1>🍄 皮克敏蘑菇計時器</h1>

  <div class="add-location-form">
    <input type="text" id="newLocationName" placeholder="輸入地點名稱...">
    <select id="newLocationType">
      <option value="wild">🌳 野外</option>
      <option value="home">🏠 住家</option>
    </select>
    <button onclick="addNewLocation()">➕ 新增</button>
  </div>

  <div class="tables-container">
    <div class="table-wrapper">
      <table>
        <thead><tr><th colspan="4" class="category-title">🌳 野外蘑菇</th></tr></thead>
        <tbody id="wild-tbody"></tbody>
      </table>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th colspan="4" class="category-title">🏠 住家蘑菇</th></tr></thead>
        <tbody id="home-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const activeTimers = new Map();

    // 當按下 Enter 觸發
    function handleEnter(e, inputEl) {
      if (e.key === 'Enter') {
        const row = inputEl.closest('tr');
        const h = parseInt(row.querySelector('.hr-input').value) || 0;
        const m = parseInt(row.querySelector('.min-input').value) || 0;
        const s = parseInt(row.querySelector('.sec-input').value) || 0;
        
        // 設定重生時間：現在 + 輸入時間 + 5分鐘(300秒)
        const target = new Date().getTime() + (h * 3600 + m * 60 + s + 300) * 1000;
        
        // 儲存至 localStorage
        const id = row.getAttribute('data-id');
        let savedTimers = JSON.parse(localStorage.getItem('pikmin_mushroom_timers')) || {};
        savedTimers[id] = target;
        localStorage.setItem('pikmin_mushroom_timers', JSON.stringify(savedTimers));
        
        startCountdown(row, target);
      }
    }

    function createRowDOM(id, type, name, target) {
      const tbody = document.getElementById(`${type}-tbody`);
      const row = document.createElement('tr');
      row.setAttribute('data-id', id);
      row.innerHTML = `
        <td>
          <div style="font-weight:bold">${name}</div>
          <div class="time-input-container">
            <input class="hr-input" placeholder="時" onkeydown="handleEnter(event, this)">
            <input class="min-input" placeholder="分" onkeydown="handleEnter(event, this)">
            <input class="sec-input" placeholder="秒" onkeydown="handleEnter(event, this)">
          </div>
        </td>
        <td class="est-time">-</td>
        <td><button class="clear-btn" onclick="clearTime(this)">清除</button></td>
        <td><button class="delete-loc-btn" onclick="removeRow(this)">移除</button></td>
      `;
      tbody.appendChild(row);
      if (target) startCountdown(row, target);
    }

    function startCountdown(row, target) {
      if (activeTimers.has(row)) clearInterval(activeTimers.get(row));
      
      const display = row.querySelector('.est-time');
      const interval = setInterval(() => {
        let diff = Math.floor((target - new Date().getTime()) / 1000);
        if (diff <= 0) {
          clearInterval(interval);
          display.innerHTML = '<span class="spawned">🍄 已重生</span>';
        } else {
          const h = Math.floor(diff / 3600);
          const m = Math.floor((diff % 3600) / 60);
          const s = diff % 60;
          display.innerText = `${h}時${m}分${s}秒`;
        }
      }, 1000);
      activeTimers.set(row, interval);
    }

    function clearTime(btn) {
      const row = btn.closest('tr');
      clearInterval(activeTimers.get(row));
      row.querySelector('.est-time').innerText = '-';
      // 清除 Storage
      const id = row.getAttribute('data-id');
      let savedTimers = JSON.parse(localStorage.getItem('pikmin_mushroom_timers')) || {};
      delete savedTimers[id];
      localStorage.setItem('pikmin_mushroom_timers', JSON.stringify(savedTimers));
    }

    function removeRow(btn) {
      const row = btn.closest('tr');
      clearTime(btn);
      row.remove();
    }
    
    function addNewLocation() {
      const name = document.getElementById('newLocationName').value;
      const type = document.getElementById('newLocationType').value;
      if(name) createRowDOM('c'+Date.now(), type, name, null);
    }

    // 初始化讀取
    window.addEventListener('DOMContentLoaded', () => {
      const savedLocs = JSON.parse(localStorage.getItem('pikmin_locations')) || [{ id: "w1", type: "wild", name: "自由飛翔" }, { id: "h1", type: "home", name: "三界公公園" }];
      const savedTimers = JSON.parse(localStorage.getItem('pikmin_mushroom_timers')) || {};
      savedLocs.forEach(loc => createRowDOM(loc.id, loc.type, loc.name, savedTimers[loc.id]));
    });
  </script>
</body>
</html>
